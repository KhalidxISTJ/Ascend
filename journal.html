<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1.0,initial-scale=1.0"
    />
    <title>Journal</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/journal.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Ascend" />
    <meta name="theme-color" content="#0f0f1a" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <h1><span class="ascend">Ascend</span></h1>
      </div>
      <hr />
      <!-- NAVIGATION -->
      <nav class="navigation">
        <div class="search-container">
          <form method="get">
            <input
              id="search-box"
              type="text"
              name="Search-box"
              placeholder="Search"
              autocomplete="on"
            />
            <button type="submit">Search</button>
          </form>
        </div>
        <div class="nav-links">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="quests.html">Quests</a>
          <a class="nav-link" href="stats.html">Stats</a>
          <a class="nav-link" href="codex.html">Codex</a>
          <a class="nav-link" href="library.html"> Library </a>
          <a class="nav-link active" href="journal.html">Journal</a>
          <a class="nav-link" href="notes.html">Notes</a>
        </div>
        <div class="right-placeholder"></div>
      </nav>
    </header>
    <main class="journal-page">
      <section class="journal-header">
        <h2>Journal</h2>
        <p>Record your thoughts, victories, setbacks, and lessons.</p>
      </section>

      <section class="journal-layout">
        <!-- Left -->

        <div class="journal-editor">
          <h3>New Entry</h3>

          <input type="text" id="journalTitle" placeholder="Entry title..." />

          <textarea
            id="journalContent"
            placeholder="Write today's journal..."
          ></textarea>

          <button id="saveJournalBtn">Save Entry</button>
        </div>

        <!-- Right -->

        <div class="journal-history">
          <h3>Previous Entries</h3>

          <div id="journalEntries">
            <p class="empty-text">No journal entries yet.</p>
          </div>
        </div>
      </section>
    </main>
    <script src="js/journal.js"></script>
  </body>
</html>
