<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quests</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/quests.css" />
    <link rel="stylesheet" href="css/ai.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="quests">
    <header>
      <h1>Welcome to <span class="ascend">Ascend</span></h1>
      <hr />
      <!-- NAVIGATION -->
      <nav class="navigation">
        <div class="search-container">
          <form method="get">
            <input
              id="search-box"
              type="text"
              name="Search-box"
              placeholder="Search"
              autocomplete="on"
            />
            <button type="submit">Search</button>
          </form>
        </div>
        <div class="nav-links">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link active" href="quests.html">Quests</a>
          <a class="nav-link" href="stats.html">Stats</a>
          <a class="nav-link" href="codex.html">Codex</a>
          <a class="nav-link" href="journal.html">Journal</a>
          <a class="nav-link" href="notes.html">Notes</a>
        </div>
        <div class="right-placeholder"></div>
      </nav>
    </header>
    <main>
      <h2>Quest System</h2>

      <div class="quest-layout">
        <!-- CREATE QUEST -->
        <section class="quest-creator" hidden>
          <h3>Create Quest</h3>

          <input
            type="text"
            id="questInput"
            placeholder="Enter a new quest..."
          />

          <select id="questCategory"></select>

          <button id="addCategoryBtn" type="button">+</button>

          <select id="questDifficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>

          <select id="questRecurring">
            <option value="none">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </select>
          <label>Start Time</label>
          <input type="time" id="questStartTime" />

          <label>End Time</label>
          <input type="time" id="questEndTime" />
          <label>Due Date</label>
          <input type="date" id="questDueDate" />
          <label for="questPriority"></label>

          <select id="questPriority">
            <option value="Critical">🔴 Critical</option>
            <option value="High">🟠 High</option>
            <option value="Medium" selected>🟡 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>
          <button id="addQuestBtn">Add Quest</button>
        </section>

        <div class="quest-toolbar">
          <button id="newQuestBtn">+ New Quest</button>

          <input type="text" id="questSearch" placeholder="Search quests..." />
        </div>
        <label for="sortQuests">Sort:</label>

        <select id="sortQuests">
          <option value="date">Due Date</option>
          <option value="priority">Priority</option>
          <option value="category">Category</option>
          <option value="section">Section</option>
          <option value="difficulty">Difficulty</option>
          <option value="name">Name (A-Z)</option>
          <option value="created">Date Created</option>
        </select>

        <!-- ACTIVE QUESTS -->
        <div class="quest-sections">
          <div id="questSections" class="quest-sections"></div>
        </div>

        <section class="quest-display">
          <ul id="questList"></ul>
        </section>

        <!-- COMPLETED QUESTS -->
        <section class="completed-quests">
          <h3>Completed Quests</h3>
          <ul id="completedQuestList"></ul>
        </section>
      </div>
    </main>
    <script src="js/player.js"></script>
    <script src="js/skillTree.js"></script>
    <script src="js/quests.js"></script>
    <script src="js/aiContext.js"></script>
    <script src="js/ascendAI.js"></script>
  </body>
</html>
