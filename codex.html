<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1.0, initial-scale=1.0"
    />

    <title>Codex</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Ascend" />
    <meta name="theme-color" content="#0f0f1a" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/codex.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>
      <div class="header-top">
        <h1><span class="ascend">Ascend</span></h1>
      </div>

      <hr />

      <nav class="navigation">
        <div class="search-container">
          <form method="get">
            <input
              id="search-box"
              type="text"
              placeholder="Search"
              autocomplete="on"
            />

            <button type="submit">Search</button>
          </form>
        </div>

        <div class="nav-links">
          <a class="nav-link" href="index.html"> Home </a>

          <a class="nav-link" href="quests.html"> Quests </a>

          <a class="nav-link" href="stats.html"> Stats </a>

          <a class="nav-link active" href="codex.html"> Codex </a>

          <a class="nav-link" href="library.html"> Library </a>

          <a class="nav-link" href="journal.html"> Journal </a>

          <a class="nav-link" href="notes.html"> Notes </a>
        </div>

        <div class="right-placeholder"></div>
      </nav>
    </header>

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>
      <h2>Codex</h2>

      <div class="codex-container">
        <!-- =================================================
             STUDY WORKSPACE
        ================================================== -->

        <section class="study-workspace">
          <div class="study-content">
            <!-- =============================================
                 LEFT — FOLDERS
            ============================================== -->

            <aside class="folder-panel">
              <hr />

              <div id="folderBreadcrumb"></div>

              <h4>Folders</h4>

              <div id="folderList"></div>

              <hr />

              <div class="folder-actions">
                <button id="backBtn">← Back</button>

                <button id="addFolderBtn">+ Add Folder</button>

                <button id="renameFolderBtn">✏ Rename Folder</button>

                <button id="deleteFolderBtn">🗑 Delete Folder</button>

                <button id="reviewModeBtn">📚 Review</button>
              </div>
            </aside>

            <!-- =============================================
                 CENTER — STUDY PANEL
            ============================================== -->

            <section class="study-panel">
              <!-- =========================================
                   NORMAL FLASHCARD COUNTER
              ========================================== -->

              <div class="card-counter-container">
                <span id="cardCounter"> Card 1 / 1 </span>
              </div>

              <!-- =========================================
                   NORMAL FLASHCARD WORKSPACE
              ========================================== -->

              <div id="flashcardWorkspace" class="flashcard-workspace">
                <div class="card-container">
                  <button id="prevBtn">&lt;</button>

                  <div class="flip-card" id="flipCard">
                    <div class="flip-inner">
                      <div class="flip-front" id="cardFront"></div>

                      <div class="flip-back" id="cardBack"></div>
                    </div>
                  </div>

                  <button id="nextBtn">&gt;</button>
                </div>
              </div>

              <!-- =========================================
                   REVIEW WORKSPACE

                   This replaces the flashcard workspace
                   while Review Mode is active.
              ========================================== -->

              <section id="reviewWorkspace" class="review-workspace hidden">
                <!-- =======================================
                     REVIEW HEADER
                ======================================== -->

                <div class="review-header">
                  <div class="review-heading">
                    <span> CODEX REVIEW </span>

                    <h3>Review Session</h3>
                  </div>

                  <!-- =====================================
                       MODE SELECTOR

                       The menu floats over the UI.
                       It does NOT increase page height.
                  ====================================== -->

                  <div class="review-mode-selector">
                    <button
                      id="reviewModeSelectorBtn"
                      class="review-mode-selector-btn"
                      type="button"
                    >
                      <span id="reviewModeSelectorLabel">
                        🎯 Multiple Choice
                      </span>

                      <span class="review-mode-arrow"> ▾ </span>
                    </button>

                    <!-- HOVER MENU -->

                    <div id="reviewModeMenu" class="review-mode-menu">
                      <!-- MULTIPLE CHOICE -->

                      <button
                        class="review-mode-option"
                        data-mode="multiple-choice"
                      >
                        <span>🎯 Multiple Choice</span>
                        <span
                          class="review-mode-due"
                          data-due-mode="multipleChoice"
                          >0 due</span
                        >
                      </button>

                      <button
                        class="review-mode-option"
                        data-mode="short-answer"
                      >
                        <span>✍️ Short Answer</span>
                        <span
                          class="review-mode-due"
                          data-due-mode="shortAnswer"
                          >0 due</span
                        >
                      </button>

                      <button class="review-mode-option" data-mode="match">
                        <span>🔗 Match</span>
                        <span class="review-mode-due" data-due-mode="match"
                          >0 due</span
                        >
                      </button>

                      <button class="review-mode-option" data-mode="recall">
                        <span>🧠 Recall</span>
                        <span class="review-mode-due" data-due-mode="recall"
                          >0 due</span
                        >
                      </button>
                    </div>
                  </div>
                </div>

                <!-- =======================================
                     REVIEW PROGRESS
                ======================================== -->

                <div class="review-progress">
                  <span id="reviewProgress"> 1 / 1 </span>
                </div>

                <!-- =======================================
                     QUESTION
                ======================================== -->

                <div class="review-question-card">
                  <span> QUESTION </span>

                  <div id="reviewQuestion"></div>
                </div>

                <!-- =======================================
                     MULTIPLE CHOICE
                ======================================== -->

                <div id="multipleChoiceReview" class="review-mode-content">
                  <div
                    id="multipleChoiceAnswers"
                    class="multiple-choice-answers"
                  ></div>
                </div>

                <!-- =======================================
                     SHORT ANSWER
                ======================================== -->

                <div id="shortAnswerReview" class="review-mode-content hidden">
                  <textarea
                    id="shortAnswerInput"
                    placeholder="Type your answer..."
                  ></textarea>

                  <button id="checkShortAnswerBtn" class="review-action-btn">
                    Check Answer
                  </button>
                </div>

                <!-- =======================================
                     MATCH
                ======================================== -->

                <div id="matchReview" class="review-mode-content hidden">
                  <div id="matchBoard" class="match-board"></div>

                  <button id="checkMatchBtn" class="review-action-btn">
                    Check Matches
                  </button>
                </div>

                <!-- =======================================
                     RECALL
                ======================================== -->

                <div id="recallReview" class="review-mode-content hidden">
                  <button id="revealRecallBtn" class="review-action-btn">
                    Reveal Answer
                  </button>

                  <div id="recallAnswer" class="recall-answer hidden"></div>
                </div>

                <!-- =======================================
                     RESULT
                ======================================== -->

                <div id="reviewResult" class="review-result hidden"></div>

                <!-- =======================================
                     SRS RATING
                ======================================== -->

                <div id="reviewRatingArea" class="review-rating-area hidden">
                  <span> How well did you know this? </span>

                  <div class="review-rating-buttons">
                    <button
                      class="review-rating-btn"
                      data-rating="again"
                      type="button"
                    >
                      <strong> Again </strong>

                      <small> 10m </small>
                    </button>

                    <button
                      class="review-rating-btn"
                      data-rating="hard"
                      type="button"
                    >
                      <strong> Hard </strong>

                      <small> 1d </small>
                    </button>

                    <button
                      class="review-rating-btn"
                      data-rating="good"
                      type="button"
                    >
                      <strong> Good </strong>

                      <small> 3d </small>
                    </button>

                    <button
                      class="review-rating-btn"
                      data-rating="easy"
                      type="button"
                    >
                      <strong> Easy </strong>

                      <small> 7d </small>
                    </button>
                  </div>
                </div>
                <!-- =======================================
                  REVIEW NAVIGATION
                  ======================================== -->

                <div id="reviewNavigation" class="review-navigation">
                  <button id="reviewPreviousBtn" type="button">
                    ← Previous
                  </button>

                  <button id="reviewNextBtn" type="button">Next →</button>
                </div>
                <!-- =======================================
                     NEXT CARD

                     JS can also generate this dynamically,
                     but keeping the element here lets CSS
                     handle it cleanly.
                ======================================== -->
              </section>
            </section>

            <!-- =============================================
                 RIGHT — CARD EDITOR
            ============================================== -->

            <aside class="add-card-panel">
              <h3>Card Editor</h3>

              <input id="frontInput" type="text" placeholder="Question" />

              <input id="backInput" type="text" placeholder="Answer" />

              <button id="addCardBtn">Add Card</button>

              <button id="editCardBtn">Edit Card</button>

              <button id="deleteCardBtn">Delete Card</button>
            </aside>
            <div id="nextReviewPanel" class="next-review-panel hidden">
              <div class="next-review-title">Next Reviews</div>

              <div id="nextReviewList" class="next-review-list"></div>
            </div>
          </div>
        </section>

        <!-- =================================================
             BULK IMPORT
        ================================================== -->

        <section class="bulk-panel">
          <h3>Bulk Import</h3>

          <textarea
            id="bulkCardInput"
            placeholder="Question | Answer&#10;"
          ></textarea>

          <button id="bulkAddBtn">Bulk Add</button>
        </section>

        <!-- =================================================
             BACKUP
        ================================================== -->

        <button id="exportCodexBtn">Export Codex</button>

        <button id="importCodexBtn">Import Codex</button>

        <input type="file" id="importCodexInput" accept=".json" hidden />
      </div>
    </main>

    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/player.js"></script>
    <script src="js/codex.js"></script>
  </body>
</html>
