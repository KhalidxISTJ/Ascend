<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Codex</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/codex.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Welcome to <span class="ascend">Ascend</span></h1>

      <hr />

      <nav class="navigation">
        <div class="search-container">
          <form method="get">
            <input
              id="search-box"
              type="text"
              placeholder="Search"
              autocomplete="on"
            />

            <button type="submit">Search</button>
          </form>
        </div>

        <div class="nav-links">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="quests.html">Quests</a>
          <a class="nav-link" href="stats.html">Stats</a>
          <a class="nav-link active" href="codex.html">Codex</a>
          <a class="nav-link" href="journal.html">Journal</a>
          <a class="nav-link" href="notes.html">Notes</a>
        </div>

        <div class="right-placeholder"></div>
      </nav>
    </header>

    <main>
      <h2>Codex</h2>

      <div class="codex-container">
        <!-- ================= STUDY ================= -->

        <section class="study-workspace">
          <div class="study-content">
            <!-- ================= LEFT ================= -->

            <aside class="folder-panel">
              <hr />

              <div id="folderBreadcrumb"></div>

              <h4>Folders</h4>

              <div id="folderList"></div>

              <hr />

              <div class="folder-actions">
                <button id="backBtn">← Back</button>

                <button id="addFolderBtn">+ Add Folder</button>

                <button id="renameFolderBtn">✏ Rename Folder</button>

                <button id="deleteFolderBtn">🗑 Delete Folder</button>

                <button id="reviewModeBtn">📚 Review</button>
              </div>
            </aside>

            <!-- ================= CENTER ================= -->

            <section class="study-panel">
              <div class="card-counter-container">
                <span id="cardCounter"> Card 1 / 1 </span>
              </div>

              <!-- ================= FLASHCARDS ================= -->

              <div id="flashcardWorkspace" class="flashcard-workspace">
                <div class="card-container">
                  <button id="prevBtn">&lt;</button>

                  <div class="flip-card" id="flipCard">
                    <div class="flip-inner">
                      <div class="flip-front" id="cardFront"></div>

                      <div class="flip-back" id="cardBack"></div>
                    </div>
                  </div>

                  <button id="nextBtn">&gt;</button>
                </div>
              </div>

              <!-- ================= REVIEW ================= -->

              <div id="reviewArea" class="review-area hidden">
                <!-- REVIEW HEADER -->

                <div class="review-header">
                  <div>
                    <span class="review-eyebrow"> CODEX REVIEW </span>

                    <h3>📚 Review Session</h3>
                  </div>

                  <div id="reviewDueCount" class="review-due-count">
                    0 cards due
                  </div>
                </div>

                <!-- REVIEW MODE SELECTOR -->

                <div id="reviewModeSelector" class="review-mode-selector">
                  <div class="review-selector-heading">
                    <h4>Choose a study mode</h4>

                    <p>Practice the cards that are due.</p>
                  </div>

                  <div class="review-mode-grid">
                    <button
                      class="review-mode-card"
                      data-review-mode="multiple-choice"
                    >
                      <span class="review-mode-icon"> 🎯 </span>

                      <span class="review-mode-title"> Multiple Choice </span>

                      <span class="review-mode-description">
                        Choose the correct answer.
                      </span>
                    </button>

                    <button
                      class="review-mode-card"
                      data-review-mode="short-answer"
                    >
                      <span class="review-mode-icon"> ✍️ </span>

                      <span class="review-mode-title"> Short Answer </span>

                      <span class="review-mode-description">
                        Type your answer.
                      </span>
                    </button>

                    <button class="review-mode-card" data-review-mode="match">
                      <span class="review-mode-icon"> 🔗 </span>

                      <span class="review-mode-title"> Match </span>

                      <span class="review-mode-description">
                        Match questions with answers.
                      </span>
                    </button>

                    <button class="review-mode-card" data-review-mode="recall">
                      <span class="review-mode-icon"> 🧠 </span>

                      <span class="review-mode-title"> Recall </span>

                      <span class="review-mode-description">
                        Recall without hints.
                      </span>
                    </button>
                  </div>
                </div>

                <!-- ================= REVIEW SESSION ================= -->

                <div id="reviewSession" class="review-session hidden">
                  <div class="review-session-top">
                    <button
                      id="changeReviewModeBtn"
                      class="review-secondary-btn"
                    >
                      ← Change Mode
                    </button>

                    <span id="reviewProgress"> 1 / 1 </span>
                  </div>

                  <!-- QUESTION -->

                  <div class="review-question-card">
                    <span class="review-question-label"> QUESTION </span>

                    <div id="reviewQuestion" class="review-question"></div>
                  </div>

                  <!-- ================= MULTIPLE CHOICE ================= -->

                  <div id="multipleChoiceArea" class="review-mode-area hidden">
                    <div
                      id="multipleChoiceAnswers"
                      class="multiple-choice-answers"
                    ></div>
                  </div>

                  <!-- ================= SHORT ANSWER ================= -->

                  <div id="shortAnswerArea" class="review-mode-area hidden">
                    <textarea
                      id="shortAnswerInput"
                      class="short-answer-input"
                      placeholder="Type your answer..."
                    ></textarea>

                    <button id="checkShortAnswerBtn" class="review-primary-btn">
                      Check Answer
                    </button>
                  </div>

                  <!-- ================= MATCH ================= -->

                  <div id="matchArea" class="review-mode-area hidden">
                    <div id="matchBoard" class="match-board"></div>

                    <button id="checkMatchBtn" class="review-primary-btn">
                      Check Matches
                    </button>
                  </div>

                  <!-- ================= RECALL ================= -->

                  <div id="recallArea" class="review-mode-area hidden">
                    <button id="revealRecallBtn" class="review-primary-btn">
                      Reveal Answer
                    </button>

                    <div id="recallAnswer" class="recall-answer hidden"></div>
                  </div>

                  <!-- ================= RESULT ================= -->

                  <div id="reviewResult" class="review-result hidden"></div>

                  <!-- ================= SRS ================= -->

                  <div id="reviewRatingArea" class="review-rating-area hidden">
                    <span class="review-rating-label">
                      How well did you know it?
                    </span>

                    <div class="review-rating-buttons">
                      <button
                        class="review-rating-btn again"
                        data-rating="again"
                      >
                        <strong>Again</strong>
                        <span>10m</span>
                      </button>

                      <button class="review-rating-btn hard" data-rating="hard">
                        <strong>Hard</strong>
                        <span>1d</span>
                      </button>

                      <button class="review-rating-btn good" data-rating="good">
                        <strong>Good</strong>
                        <span>3d</span>
                      </button>

                      <button class="review-rating-btn easy" data-rating="easy">
                        <strong>Easy</strong>
                        <span>4d+</span>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- ================= TEST/RESULT REMOVED ================= -->
              </div>
            </section>

            <!-- ================= RIGHT ================= -->

            <aside class="add-card-panel">
              <h3>Card Editor</h3>

              <input id="frontInput" type="text" placeholder="Question" />

              <input id="backInput" type="text" placeholder="Answer" />

              <button id="addCardBtn">Add Card</button>

              <button id="editCardBtn">Edit Card</button>

              <button id="deleteCardBtn">Delete Card</button>
            </aside>
          </div>
        </section>

        <!-- ================= BULK IMPORT ================= -->

        <section class="bulk-panel">
          <h3>Bulk Import</h3>

          <textarea
            id="bulkCardInput"
            placeholder="Question | Answer&#10;"
          ></textarea>

          <button id="bulkAddBtn">Bulk Add</button>
        </section>

        <!-- ================= BACKUP ================= -->

        <button id="exportCodexBtn">Export Codex</button>

        <button id="importCodexBtn">Import Codex</button>

        <input type="file" id="importCodexInput" accept=".json" hidden />
      </div>
    </main>

    <script src="js/player.js"></script>
    <script src="js/codex.js"></script>
  </body>
</html>
