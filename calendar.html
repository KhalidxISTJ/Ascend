<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1.0, initial-scale=1.0"
    />
    <title>Calendar</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="Images\icons\Ascend Logo PWA 512x.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Ascend" />
    <meta name="theme-color" content="#0f0f1a" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/calendar.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="header-top">
        <h1>
          <a href="index.html">
            <img
              src="Images/icons/Ascend Logo PWA 512x.png"
              alt="Ascend's Logo"
              class="ascend-logo"
              title="Ascend's Logo"
            />
          </a>
        </h1>
        <nav class="navigation">
          <div class="left-placeholder"></div>
          <div class="nav-links">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="quests.html">Quests</a>
            <a class="nav-link" href="stats.html">Stats</a>
            <a class="nav-link" href="codex.html">Codex</a>
            <a class="nav-link" href="library.html">Library</a>
            <a class="nav-link active" href="calendar.html">Calendar</a>
          </div>
          <div class="right-placeholder"></div>
        </nav>
        <div id="version" class="version-badge"></div>
      </div>
      <hr />
    </header>

    <main class="calendar-page">
      <h2>📅 Calendar</h2>

      <div class="calendar-header">
        <div class="view-toggles">
          <button class="view-btn active" data-view="day">📅 Day</button>
          <button class="view-btn" data-view="week">📆 Week</button>
          <button class="view-btn" data-view="month">🗓️ Month</button>
        </div>
        <div class="week-nav">
          <button id="prev-week">←</button>
          <span id="week-label">Today</span>
          <button id="next-week">→</button>
        </div>
      </div>

      <!-- SCROLLABLE CONTAINER -->
      <div id="timeline-container" class="timeline-container">
        <div id="timeline" class="timeline">
          <!-- Timeline will be rendered here -->
        </div>
      </div>
    </main>

    <script src="js/calendar.js"></script>
    <script src="js/version.js"></script>
    <script src="js/versionUI.js"></script>
    <script src="js/player.js"></script>
  </body>
</html>
