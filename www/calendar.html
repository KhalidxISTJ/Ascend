<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, maximum-scale=1.0, initial-scale=1.0" />
  <title>Calendar</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="Images\icons\ascendLogo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ascend" />
  <meta name="theme-color" content="#0f0f1a" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navigation.css" />
  <link rel="stylesheet" href="css/calendar.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet" />
</head>

<body data-page="calendar">
  <div id="nav-placeholder"></div>

  <main class="calendar-page">
    <h2>📅 Calendar</h2>
    <div class="all-day">
      <span>All Day</span>
      <div id="all-day-events"></div>
    </div>
    <div class="calendar-wrapper">
      <div class="time-column" id="time-column"></div>
      <div class="event-column" id="event-column">
      </div>
    </div>
  </main>

  <script src="js/calendar.js"></script>
  <script src="js/version.js"></script>
  <script src="js/versionUI.js"></script>
  <script src="js/player.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
