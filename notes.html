<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/notes.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Welcome to <span class="ascend">Ascend</span></h1>
      <hr />
      <!-- NAVIGATION -->
      <nav class="navigation">
        <div class="search-container">
          <form method="get">
            <input
              id="search-box"
              type="text"
              name="Search-box"
              placeholder="Search"
              autocomplete="on"
            />
            <button type="submit">Search</button>
          </form>
        </div>
        <div class="nav-links">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="quests.html">Quests</a>
          <a class="nav-link" href="stats.html">Stats</a>
          <a class="nav-link" href="codex.html">Codex</a>
          <a class="nav-link" href="journal.html">Journal</a>
          <a class="nav-link active" href="notes.html">Notes</a>
        </div>
        <div class="right-placeholder"></div>
      </nav>
    </header>
    <main class="notes-page">
      <h2>Notes</h2>

      <div class="notes-grid">
        <!-- Left Side -->

        <section class="notes-editor">
          <h3>Create Note</h3>

          <input id="noteTitle" type="text" placeholder="Title" />

          <textarea
            id="noteContent"
            placeholder="Write your note..."
          ></textarea>

          <button id="saveNoteBtn">Save Note</button>
        </section>

        <!-- Right Side -->

        <section class="notes-history">
          <h3>My Notes</h3>

          <input id="noteSearch" type="text" placeholder="Search..." />

          <div id="notesContainer"></div>
        </section>
      </div>
    </main>
    <script src="js/notes.js"></script>
  </body>
</html>
